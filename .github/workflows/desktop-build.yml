name: Desktop Builds

on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package-desktop:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45

    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows MSI
            os: windows-2025
            gradle-task: :desktopApp:packageMsi
            artifact-name: cellfie-windows-msi
            artifact-path: desktopApp/build/compose/binaries/main/msi/*.msi

          - name: macOS DMG (Apple Silicon)
            os: macos-15
            gradle-task: :desktopApp:packageDmg
            artifact-name: cellfie-macos-arm64-dmg
            artifact-path: desktopApp/build/compose/binaries/main/dmg/*.dmg

          - name: macOS DMG (Intel)
            os: macos-15-intel
            gradle-task: :desktopApp:packageDmg
            artifact-name: cellfie-macos-intel-dmg
            artifact-path: desktopApp/build/compose/binaries/main/dmg/*.dmg

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up JDK
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Ensure Gradle wrapper is executable
        if: runner.os != 'Windows'
        run: chmod +x ./gradlew

      - name: Ensure WiX Toolset is available
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          if (-not (Get-Command candle.exe -ErrorAction SilentlyContinue)) {
            choco install wixtoolset --no-progress -y
          }

          $wixDir = Get-ChildItem "${env:ProgramFiles(x86)}" -Directory -Filter "WiX Toolset v3*" |
            Sort-Object Name -Descending |
            Select-Object -First 1

          if ($wixDir) {
            Join-Path $wixDir.FullName "bin" | Out-File -FilePath $env:GITHUB_PATH -Append
          }

      - name: Build native package
        shell: bash
        run: ./gradlew ${{ matrix.gradle-task }} --stacktrace

      - name: Upload package
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact-name }}
          path: ${{ matrix.artifact-path }}
          if-no-files-found: error
